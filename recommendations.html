<!DOCTYPE html>
<html>
<head>
    <title>Recommandations LLM AI</title>
</head>
<body>
    <!-- Page dashboard des recommandations. Le data-controller charge les données et gère l'UI. -->
    <div data-role="page"
         class="type-interior LLMAIRecommendationsPage"
         data-require="emby-button"
         data-controller="__plugin/LLMAIRecommendationsPageJS">

        <style>
            .LLMAIRecommendationsPage {
                /* Fallback sombre. Le JS applique l'image de fond via ApiClient.getUrl
                   pour garantir une URL absolue (injection innerHTML). */
                background-color: #101010;
                min-height: 100%;
            }
            /* Le titre de page par défaut peut être invisible sur fond sombre ; on force une couleur lisible. */
            .LLMAIRecommendationsPage .sectionTitle {
                color: #e8e8e8 !important;
            }
            .LLMAIRecommendationsPage .content-primary {
                background-color: #181818 !important;
                padding: 1.5em !important;
                border-radius: 6px !important;
            }
            .LLMAIRecommendationsPage .recMeta {
                color: #9a9a9a;
                font-size: 0.9em;
                margin-bottom: 1em;
            }
            .LLMAIRecommendationsPage .section-counter {
                color: #9a9a9a;
                font-size: 0.7em;
                font-weight: normal;
                margin-left: 0.6em;
            }
            .LLMAIRecommendationsPage .recEmpty {
                color: #c9c9c9;
                padding: 2em 0;
                text-align: center;
            }
            .LLMAIRecommendationsPage .recSection {
                margin-bottom: 1.5em;
            }
            .LLMAIRecommendationsPage .recSectionTitle {
                margin: 0.4em 0 0.7em;
                color: #e8e8e8;
                font-size: 1.15em;
            }

            /* ---- Grille de cartes ---- */
            .LLMAIRecommendationsPage .ai-cards-container {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 15px;
            }
            .LLMAIRecommendationsPage .ai-card {
                background: #202020;
                border: 1px solid #333;
                border-radius: 8px;
                display: flex;
                overflow: hidden;
                transition: all 0.2s;
            }
            .LLMAIRecommendationsPage .ai-card:hover {
                border-color: #667eea;
                box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            }
            .LLMAIRecommendationsPage .ai-card.fading {
                opacity: 0;
                transform: scale(0.9);
                transition: all 0.3s ease;
            }
            .LLMAIRecommendationsPage .ai-card-poster {
                position: relative;
                width: 90px;
                min-width: 90px;
                aspect-ratio: 2/3;
                background: #333;
                align-self: stretch;
            }
            .LLMAIRecommendationsPage .ai-card-poster img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .LLMAIRecommendationsPage .ai-card-poster .ai-poster-placeholder {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #666;
                font-size: 2em;
            }
            .LLMAIRecommendationsPage .ai-priority-badge {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                text-align: center;
                color: white;
                font-size: 0.65em;
                font-weight: bold;
                padding: 2px;
            }
            /* Badge de type (À venir, Enregistrement, etc.) sur le poster. */
            .LLMAIRecommendationsPage .ai-type-badge {
                position: absolute;
                top: 0;
                left: 0;
                width: 1.7em;
                height: 1.7em;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 0.85em;
                font-weight: bold;
                border-radius: 0 0 4px 0;
                line-height: 1;
            }
            .LLMAIRecommendationsPage .ai-type-badge.ai-type-upcoming { background: #1f6feb; }
            .LLMAIRecommendationsPage .ai-type-badge.ai-type-rec { background: #6a4fbf; }
            .LLMAIRecommendationsPage .ai-type-badge.ai-type-lib { background: #2a7a7a; }
            .LLMAIRecommendationsPage .ai-type-badge.ai-type-aired { background: #555; color: #ccc; }
            .LLMAIRecommendationsPage .ai-type-badge.ai-type-watched { background: #8a6d1a; color: #f5eecf; }
            /* Estompe les recos passées (diffusées ou déjà vues) pour les distinguer des recos actionnables. */
            .LLMAIRecommendationsPage .ai-card[data-aired="1"],
            .LLMAIRecommendationsPage .ai-card[data-watched="1"] {
                opacity: 0.72;
            }
            .LLMAIRecommendationsPage .ai-card-info {
                padding: 10px;
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                gap: 4px;
                min-width: 0;
            }
            .LLMAIRecommendationsPage .ai-card-title {
                font-weight: 600;
                font-size: 0.95em;
                color: #e8e8e8;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .LLMAIRecommendationsPage .ai-card-meta {
                color: #aaa;
                font-size: 0.78em;
            }
            .LLMAIRecommendationsPage .ai-card-reason {
                color: #b8b8ff;
                font-size: 0.78em;
                line-height: 1.3;
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
                flex-grow: 1;
            }
            .LLMAIRecommendationsPage .ai-card-actions {
                display: flex;
                gap: 6px;
                margin-top: 4px;
            }
            .LLMAIRecommendationsPage .ai-btn-record {
                background: #2ecc71;
                color: white;
                border: none;
                padding: 6px 10px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.8em;
                font-weight: 600;
                flex: 1;
                transition: background 0.2s;
            }
            .LLMAIRecommendationsPage .ai-btn-record:hover { background: #27ae60; }
            .LLMAIRecommendationsPage .ai-btn-record.success { background: #27ae60; pointer-events: none; }
            .LLMAIRecommendationsPage .ai-btn-record:disabled {
                background: #444;
                color: #888;
                cursor: not-allowed;
            }
            /* Style pour un programme déjà programmé (état neutre/gris). */
            .LLMAIRecommendationsPage .ai-btn-record.already {
                background: #555;
                color: #bbb;
                pointer-events: none;
                cursor: default;
            }
            .LLMAIRecommendationsPage .ai-btn-drop {
                background: #444;
                color: #ff6b6b;
                border: 1px solid #555;
                padding: 6px 10px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.8em;
                font-weight: 600;
                flex: 1;
                transition: all 0.2s;
            }
            .LLMAIRecommendationsPage .ai-btn-drop:hover { background: #ff6b6b; color: white; border-color: #ff6b6b; }
            .LLMAIRecommendationsPage .ai-btn-drop.loading { background: #555; cursor: wait; }

            .LLMAIRecommendationsPage .rawJson {
                margin-top: 1em;
                white-space: pre-wrap;
                word-break: break-word;
                color: #8a8a8a;
                font-family: monospace;
                font-size: 0.8em;
                max-height: 18em;
                overflow: auto;
                background: #111;
                padding: 0.8em;
                border-radius: 4px;
            }
            .LLMAIRecommendationsPage .toggleRaw {
                margin-top: 1em;
            }

            /* ---- Section « À regarder ce soir » (endpoint plugin) ---- */
            .LLMAIRecommendationsPage .tonightSection {
                border-top: 1px solid #333;
                padding-top: 0.6em;
            }
            .LLMAIRecommendationsPage .tonight-actions {
                margin-bottom: 0.8em;
            }
            .LLMAIRecommendationsPage .tonight-cache {
                color: #8ab4f8;
                font-size: 0.7em;
                font-weight: normal;
                margin-left: 0.5em;
                border: 1px solid #3a5a8a;
                border-radius: 3px;
                padding: 1px 5px;
            }
            .LLMAIRecommendationsPage .ai-btn-watchlive {
                background: #1f6feb;
                color: white;
                border: none;
                padding: 6px 10px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.8em;
                font-weight: 600;
                flex: 1;
                transition: background 0.2s;
            }
            .LLMAIRecommendationsPage .ai-btn-watchlive:hover { background: #388bfd; }
                        .LLMAIRecommendationsPage .ai-btn-watchrec {
                background: #238636;
                color: white;
                border: none;
                padding: 6px 10px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.8em;
                font-weight: 600;
                flex: 1;
                transition: background 0.2s;
            }
            .LLMAIRecommendationsPage .ai-btn-watchrec:hover { background: #2ea043; }
            /* Spinner de chargement (run LLM). */
            .LLMAIRecommendationsPage .tonight-spinner {
                display: inline-block;
                width: 1em;
                height: 1em;
                vertical-align: middle;
                border: 2px solid #555;
                border-top-color: #e8e8e8;
                border-radius: 50%;
                animation: llmai-spin 0.8s linear infinite;
                margin-right: 0.4em;
            }
            @keyframes llmai-spin { to { transform: rotate(360deg); } }
        </style>

        <div data-role="content">
            <div class="content-primary">
                <div class="verticalSection">
                    <h2 class="sectionTitle"><span data-i18n="rec.title">🤖 Recommandations LLM AI</span>
                        <span id="recCount" class="section-counter"></span>
                    </h2>
                    <div id="recMeta" class="recMeta"></div>
                    <div id="recContent"></div>
                    <div class="toggleRaw">
                        <button is="emby-button" type="button" class="raised block" id="btnToggleRaw" style="display:none;" data-i18n="rec.toggleRaw">
                            Afficher / masquer le JSON brut
                        </button>
                    </div>
                    <pre id="recRaw" class="rawJson" style="display:none;"></pre>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
